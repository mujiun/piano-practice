<style>
  /* ===============================================================
     Piano Practice · iPad app · mu-system greyscale
     =============================================================== */
  html, body { height: 100%; }
  body { background: #e6e6e9; overflow: hidden; }
  /* instant taps (no double-tap-zoom delay) while still allowing pinch-zoom on scores */
  * { touch-action: manipulation; }

  /* ---- iPad device frame (portrait 834 × 1194) ---- */
  .stage {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .device {
    width: min(834px, 100vw);
    height: min(1194px, calc(100vh - 40px));
    background: var(--mu-bg);
    border-radius: 40px;
    box-shadow: var(--mu-shadow-lg);
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }
  /* native app (Capacitor) / installed PWA: always full-bleed, no desktop mockup frame */
  html.is-native .stage { padding: 0; min-height: 100vh; min-height: 100dvh; align-items: stretch; }
  html.is-native .device { width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; border-radius: 0; box-shadow: none; }
  @media (max-width: 1024px) {
    .stage { padding: 0; min-height: 100vh; min-height: 100dvh; align-items: stretch; }
    .device { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; }
  }

  /* ---- screen scroll area ---- */
  .screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top); }
  .screen::-webkit-scrollbar { width: 0; }
  .view { display: none; padding: 8px 28px 120px; }
  .view.is-active { display: block; }

  /* ---- app top bar ---- */
  .appbar {
    position: sticky; top: 0; z-index: 40;
    background: rgba(255,255,255,.86);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    padding: 20px 28px 14px;
    margin: 0 -28px 4px;
    display: flex; align-items: center; gap: 12px;
  }
  .appbar-title { font-size: 30px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.25em; }
  .appbar-sub { font-size: 13px; color: var(--mu-ink-3); margin-top: 0; }
  .appbar-back {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%;
    border: 1px solid var(--mu-border); background: var(--mu-white);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background var(--mu-fast) var(--mu-ease);
  }
  .appbar-back:hover { background: var(--mu-gray-50); }
  .appbar-spacer { flex: 1; }

  /* ---- search ---- */
  .search {
    position: relative; margin: 2px 0 8px;
  }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--mu-gray-500); pointer-events: none; }
  .search input {
    width: 100%; height: 50px; padding: 0 16px 0 46px;
    background: var(--mu-gray-100); border: 1px solid transparent; border-radius: var(--mu-radius-md);
    font-size: 16px; color: var(--mu-ink); outline: none;
    transition: background var(--mu-fast) var(--mu-ease), border-color var(--mu-fast) var(--mu-ease);
  }
  .search input::placeholder { color: var(--mu-gray-500); }
  .search input:focus { background: var(--mu-white); border-color: var(--mu-gray-900); box-shadow: var(--mu-focus-ring); }

  /* ---- section header ---- */
  .sec { margin-top: 26px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .sec-title { font-size: 19px; font-weight: 650; letter-spacing: -0.015em; }
  .sec-title span { font-weight: 600; }
  .sec-link { font-size: 13px; font-weight: 500; color: var(--mu-ink-3); cursor: pointer; }
  .sec-link:hover { color: var(--mu-ink); }

  /* ---- horizontal scroller ---- */
  .hscroll { display: flex; gap: 14px; overflow-x: auto; margin: 0 -28px; padding: 2px 28px 8px; -webkit-overflow-scrolling: touch; }
  .hscroll::-webkit-scrollbar { height: 0; }
  .hscroll > * { flex-shrink: 0; }
  .hscroll::after { content: ""; flex: 0 0 14px; }

  /* ---- home 2-column (1:1): each section = title + card ---- */
  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch; }
  .home-col { display: flex; flex-direction: column; }
  .home-block-title { font-size: 19px; font-weight: 650; letter-spacing: -0.015em; margin-bottom: 12px; flex-shrink: 0; }
  .home-card { border: 1px solid var(--mu-border); border-radius: var(--mu-radius-lg); background: var(--mu-white); padding: 6px 16px; }
  /* left: recent play — fixed height (~8 rows), scrolls if more */
  .home-grid > .home-col:first-child .home-card { height: 531px; overflow: hidden; }
  /* right: practice + calendar split 3:2 */
  .home-grid > .home-col:last-child .home-card { min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .home-grid > .home-col:last-child .practice-card { flex: 3; }
  .home-grid > .home-col:last-child .home-cal { flex: 2; }
  /* Your practice — cat illustration background + top scrim for readable stats */
  .practice-card { position: relative; overflow: hidden; justify-content: flex-start !important;
    background: url("images/illustration/cat.jpg") center 18% / cover no-repeat; }
  .practice-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 96px;
    background: linear-gradient(rgba(255,255,255,.92), rgba(255,255,255,0)); z-index: 0; }
  .practice-card .side-stats { position: relative; z-index: 1; }
  .home-card .rlist { display: flex; flex-direction: column; margin: 0 -10px; }
  .rrow { display: flex; align-items: center; gap: 12px; padding: 10px; position: relative; cursor: pointer; }
  .rrow::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 1px; background: var(--mu-gray-100); }
  .rrow:last-child::after { display: none; }
  .rrow:hover { background: var(--mu-gray-50); border-radius: var(--mu-radius-md); }
  .rthumb { width: 44px; height: 44px; border-radius: 8px; background: var(--mu-gray-100); flex-shrink: 0; }
  .rrow-body { flex: 1; min-width: 0; }
  .rrow-title { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .rrow-sub { font-size: 12.5px; color: var(--mu-ink-3); margin-top: 1px; }
  .rrow-pct { font-family: var(--mu-mono); font-size: 12px; color: var(--mu-ink-3); flex-shrink: 0; }
  .side-stats { display: flex; gap: 36px; padding: 14px 0; }
  .side-num { font-size: 38px; font-weight: 700; letter-spacing: -0.025em; line-height: 1; }
  .side-lbl { font-size: 13px; color: var(--mu-ink-3); margin-top: 6px; }
  /* practice card sits on the light cat painting in both themes → keep its text dark */
  .practice-card .side-num { color: #17171b; }
  .practice-card .side-lbl { color: rgba(23,23,27,.62); }
  .home-cal { justify-content: flex-start !important; padding: 6px 16px 18px; }
  .home-cal .cal-date-big { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; padding: 10px 0 20px; }
  .cal-events { display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .cal-event { display: flex; align-items: flex-start; gap: 14px; }
  .cal-avatar { width: 48px; height: 48px; border-radius: 15%; object-fit: cover; filter: grayscale(1); flex-shrink: 0;
    background: var(--mu-white); padding: 2px; box-shadow: 0 2px 5px rgba(0,0,0,.10); transform: rotate(-10deg); }
  .cal-avatar-ph { display: inline-flex; align-items: center; justify-content: center; background: var(--mu-gray-100); color: var(--mu-gray-400); }
  .cal-avatar-ph svg { width: 20px; height: 20px; }
  .cal-event-text { min-width: 0; }
  .cal-eyebrow { font-size: 12px; font-weight: 600; color: var(--mu-ink-3); }
  .cal-title { font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; }
  .cal-sub { font-size: 12.5px; color: var(--mu-ink-3); line-height: 1.45; margin-top: 4px; }
  .cal-link { font-weight: 600; color: var(--mu-ink); text-decoration: none; cursor: pointer; white-space: nowrap; }

  /* ---- recent tile (legacy carousel, unused) ---- */
  .recent-tile { width: 190px; cursor: pointer; }
  .recent-art {
    height: 116px; border-radius: var(--mu-radius-md); overflow: hidden; position: relative;
    background: var(--mu-gray-100);
    display: flex; align-items: flex-end; padding: 12px;
  }
  .recent-art .ring {
    position: relative; z-index: 2; font-size: 11px; font-weight: 600; color: var(--mu-ink-2);
    background: var(--mu-white); border: 1px solid var(--mu-border); border-radius: var(--mu-radius-full); padding: 4px 10px;
  }
  .recent-tile .rt-title { font-size: 14px; font-weight: 600; margin-top: 9px; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-tile .rt-sub { font-size: 12px; color: var(--mu-ink-3); margin-top: 1px; }

  /* ---- calendar card ---- */
  .cal-card {
    width: 260px; padding: 16px; border-radius: var(--mu-radius-lg);
    background: var(--mu-white); border: 1px solid var(--mu-border); cursor: default;
    display: flex; flex-direction: column; gap: 8px;
  }
  .cal-card.is-next { background: var(--mu-gray-900); border-color: var(--mu-gray-900); color: #fff; }
  .cal-date { font-family: var(--mu-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mu-ink-3); }
  .cal-card.is-next .cal-date { color: rgba(255,255,255,.6); }
  .cal-kind {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: var(--mu-radius-full);
    background: var(--mu-gray-100); color: var(--mu-ink-2);
  }
  .cal-card.is-next .cal-kind { background: rgba(255,255,255,.16); color: #fff; }
  .cal-body { font-size: 14.5px; line-height: 1.4; font-weight: 500; }
  .cal-card.is-next .cal-body { color: #fff; }
  .cal-today { width: auto; }

  /* ---- piece row ---- */
  .rowlist { display: flex; flex-direction: column; margin: 0 -12px; }
  .prow {
    display: flex; align-items: center; gap: 14px; padding: 12px;
    position: relative; cursor: pointer;
  }
  .prow::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 1px; background: var(--mu-gray-100); }
  .prow:hover { background: var(--mu-gray-50); border-radius: var(--mu-radius-md); }
  .prow-num { width: 26px; text-align: center; font-family: var(--mu-mono); font-size: 13px; color: var(--mu-gray-400); flex-shrink: 0; }
  .prow-body { flex: 1; min-width: 0; }
  .prow-title { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pn-dim { color: var(--mu-ink-3); font-weight: 500; }
  .prow-title .pn-dim, .rrow-title .pn-dim { font-weight: inherit; } /* rows: grey but same 600 weight */
  .prow-meta { font-size: 12.5px; color: var(--mu-ink-3); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .prow-meta .dot-sep::before { content: "·"; margin-right: 8px; }
  .prow-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .lvpill { font-family: var(--mu-mono); font-size: 11px; font-weight: 600; color: var(--mu-ink-2);
    background: var(--mu-gray-100); border-radius: var(--mu-radius-full); padding: 3px 8px; }
  .prow-pct { font-family: var(--mu-mono); font-size: 12px; color: var(--mu-ink-3); width: 34px; text-align: right; }

  /* ---- composer grid ---- */
  .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ccard {
    border: 1px solid var(--mu-border); border-radius: var(--mu-radius-lg); padding: 14px 16px;
    cursor: pointer; display: flex; flex-direction: row; align-items: center; gap: 14px;
    transition: box-shadow var(--mu-slow) var(--mu-ease), transform var(--mu-slow) var(--mu-ease);
    background: var(--mu-white);
  }
  .ccard:hover { box-shadow: var(--mu-shadow-md); }
  .cav {
    width: 52px; height: 52px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.02em;
    background: linear-gradient(150deg, #34343a, #6a6a73);
  }
  /* photo avatar (rounded square, white frame, light shadow) */
  .cav-photo {
    background: var(--mu-white); padding: 2px; overflow: hidden;
    border-radius: 15%; box-shadow: 0 2px 5px rgba(0,0,0,.10);
    transform: rotate(-5deg);
  }
  .cav-photo img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 12%; filter: grayscale(1); }
  .ccard .cav { width: 48px; height: 48px; flex-shrink: 0; }
  .ccard-text { flex: 1; min-width: 0; }
  .ccard-name { font-size: 16px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.25em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ccard-era { font-size: 12.5px; color: var(--mu-ink-3); }
  .ccard-count { flex-shrink: 0; text-align: center; font-family: var(--mu-mono); font-size: 19px; font-weight: 400;
    color: var(--mu-ink-2); line-height: 1; }
  .ccard-count span { display: block; font-family: inherit; font-size: 9px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--mu-gray-400); margin-top: 4px; }

  /* ---- pianist detail hero ---- */
  .phero { display: flex; gap: 16px; align-items: flex-start; padding: 6px 0 4px; }
  .phero .cav { width: 72px; height: 72px; font-size: 30px; margin: 0; flex-shrink: 0; }
  .phero-txt { flex: 1; min-width: 0; }
  .phero-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .phero-name { font-size: 21px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.15; }
  .phero-era { font-size: 12.5px; color: var(--mu-ink-3); white-space: nowrap; }
  .phero-bio { font-size: 13px; color: var(--mu-ink-2); line-height: 1.5; margin-top: 6px; }

  /* ---- filter/sort bar ---- */
  .filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 6px; }
  .filterbar .grow { flex: 1; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--mu-gray-100); border-radius: var(--mu-radius-full); }
  .seg button {
    height: 32px; padding: 0 14px; border: none; background: transparent; border-radius: var(--mu-radius-full);
    font-size: 13px; font-weight: 500; color: var(--mu-ink-2); cursor: pointer;
    transition: color var(--mu-fast) var(--mu-ease);
  }
  .seg button.is-active { background: var(--mu-white); color: var(--mu-ink); box-shadow: var(--mu-shadow-sm); }
  .filter-count { font-family: var(--mu-mono); font-size: 12px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--mu-gray-400); }
  /* upfront sort chips */
  .sortchips { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 28px 0 6px; }
  .sortchips .grow { flex: 1; }
  .psearch { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; min-width: 160px;
    border: 1px solid var(--mu-border); border-radius: var(--mu-radius-full); background: var(--mu-white); }
  .psearch:focus-within { background: var(--mu-white); border-color: var(--mu-gray-900); box-shadow: var(--mu-focus-ring); }
  .psearch-ic { display: inline-flex; color: var(--mu-gray-500); }
  .psearch-ic svg { width: 16px; height: 16px; }
  .psearch input { border: none; background: transparent; outline: none; font-size: 13px; color: var(--mu-ink); width: 130px; }
  .sortchips .filter-count { align-self: center; }
  /* desktop/iPad: pill with border + "Sort" text */
  .sort-lead { display: inline-flex; align-items: center; justify-content: center; gap: 5px; align-self: center; height: 36px; padding: 0 12px; border: 1px solid var(--mu-border); background: var(--mu-white); border-radius: var(--mu-radius-full); cursor: pointer; color: var(--mu-ink-2); font-size: 13px; font-weight: 500; margin-right: 2px; }
  .sort-lead:hover { border-color: var(--mu-gray-400); }
  .sort-divider { align-self: center; width: 1px; height: 22px; background: var(--mu-border); margin: 0 6px; flex-shrink: 0; }
  .sort-by-label { align-self: center; font-size: 13px; font-weight: 500; color: var(--mu-ink-3); margin-right: 6px; white-space: nowrap; }
  .sort-lead svg { flex-shrink: 0; }
  .sort-lead .sd-up, .sort-lead .sd-dn { stroke: var(--mu-gray-400); }
  .sort-lead[data-dir="asc"] .sd-up { stroke: var(--mu-ink); }
  .sort-lead[data-dir="desc"] .sd-dn { stroke: var(--mu-ink); }
  .sortchips > button[data-sort] { height: 36px; padding: 0 14px; border: 1px solid var(--mu-border); background: var(--mu-white);
    border-radius: var(--mu-radius-full); font-size: 13px; font-weight: 500; color: var(--mu-ink-2); cursor: pointer;
    transition: background var(--mu-fast) var(--mu-ease), color var(--mu-fast) var(--mu-ease), border-color var(--mu-fast) var(--mu-ease); }
  .sortchips > button[data-sort]:hover { border-color: var(--mu-gray-400); }
  .sortchips > button[data-sort].is-active { background: var(--mu-gray-900); color: #fff; border-color: var(--mu-gray-900); }
  /* compact sort dropdown — mobile only (chips shown on desktop/iPad); mu-system dropdown style */
  .sortdd { display: none; position: relative; }
  .sort-trigger { width: auto; height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px; font-weight: 500; border-radius: var(--mu-radius-full); white-space: nowrap; }
  /* custom sort dropdown (native select panels can't be styled) */
  .sortdd { position: relative; }
  .sortdd-btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
    border: 1px solid var(--mu-border); border-radius: var(--mu-radius-full); background: var(--mu-white);
    font-size: 13px; color: var(--mu-ink); cursor: pointer; transition: border-color var(--mu-fast) var(--mu-ease); }
  .sortdd-btn:hover { border-color: var(--mu-gray-400); }
  .sortdd-lab { color: var(--mu-ink-3); font-weight: 500; }
  .sortdd-btn b { font-weight: 600; }
  .sortdd-btn svg { color: var(--mu-gray-500); transition: transform var(--mu-fast) var(--mu-ease); }
  .sortdd.open .sortdd-btn { border-color: var(--mu-gray-900); box-shadow: var(--mu-focus-ring); }
  .sortdd.open .sortdd-btn svg { transform: rotate(180deg); }
  .sortdd-panel { position: absolute; top: calc(100% + 6px); right: 0; min-width: 170px; z-index: 50;
    background: var(--mu-white); border: 1px solid var(--mu-border); border-radius: var(--mu-radius-md);
    box-shadow: var(--mu-shadow-md); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .sortdd-panel[hidden] { display: none; }
  .sortdd-panel button { display: flex; align-items: center; justify-content: space-between; text-align: left;
    height: 38px; padding: 0 12px; border: none; background: transparent; border-radius: var(--mu-radius-sm);
    font-size: 14px; color: var(--mu-ink); cursor: pointer; }
  .sortdd-panel button:hover { background: var(--mu-gray-100); }
  .sortdd-panel button.is-sel { font-weight: 650; }
  .sortdd-panel button.is-sel::after { content: "✓"; color: var(--mu-ink-2); font-size: 13px; }
  .grouphead { font-family: var(--mu-mono); font-size: 11.5px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--mu-gray-400); margin: 22px 0 4px; padding-left: 0; }

  /* ===============================================================
     Sheet detail
     =============================================================== */
  .sheet-hero { margin-top: 6px; }
  .sheet-eyebrow { font-size: 14px; font-weight: 600; color: var(--mu-ink-2); letter-spacing: -0.01em; }
  .sheet-title { font-size: 27px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.1; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-title .pn-dim { color: inherit; font-weight: inherit; }
  .sheet-work { font-size: 15px; font-weight: 500; color: var(--mu-ink-3); margin-top: 5px; }
  .sheet-sub { font-size: 17px; font-weight: 500; color: var(--mu-ink-3); letter-spacing: 0; }
  .sheet-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .sheet-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px;
    font-size: 13px; color: var(--mu-ink-3); }
  .sheet-meta b { font-weight: 650; color: var(--mu-ink-2); }
  .sheet-meta span:not(:first-child)::before { content: "·"; margin-right: 8px; color: var(--mu-gray-300); }

  /* sheet sub-tabs (Overview / Practice / Focus) */
  .sheet-tabs { margin: 16px 0 4px; }
  .sheet-tabs .seg { width: 100%; }
  .sheet-tabs .seg button { flex: 1; }

  /* overview preview */
  .sheet-preview { position: relative; margin-top: 14px; border: 1px solid var(--mu-border);
    border-radius: var(--mu-radius-lg); background: var(--mu-white); overflow: hidden; cursor: pointer; }
  .sheet-preview iframe, .sheet-preview .score-svg-wrap { display: block; }
  .sheet-preview .score-svg-wrap { padding: 16px; }
  .preview-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
    background: linear-gradient(to bottom, transparent, var(--mu-white)); pointer-events: none; }
  .tap-hint { position: absolute; right: 12px; bottom: 12px; font-size: 12px; font-weight: 600;
    color: #fff; background: rgba(0,0,0,.62); border-radius: var(--mu-radius-full); padding: 6px 12px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

  /* explore tab — story sections */
  .about-block { margin-top: 22px; }
  .about-label { font-family: var(--mu-mono); font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--mu-gray-400); margin-bottom: 4px; }
  .about-block p { font-size: 14px; color: var(--mu-ink); line-height: 1.55; }

  /* explore tab links */
  .explore-links { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .explore-link { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--mu-border);
    border-radius: var(--mu-radius-md); background: var(--mu-white); color: var(--mu-ink); text-decoration: none;
    font-size: 14.5px; font-weight: 550; transition: background var(--mu-fast) var(--mu-ease); }
  .explore-link:hover { background: var(--mu-gray-50); }
  .explore-link svg { color: var(--mu-ink-2); flex-shrink: 0; }
  .explore-link span:first-of-type { flex: 1; }
  .explore-arrow { color: var(--mu-gray-400); font-size: 15px; }

  /* practice tab */
  .prac-intro { font-size: 13.5px; line-height: 1.5; color: var(--mu-ink-2); background: var(--mu-gray-50);
    border: 1px solid var(--mu-border); border-radius: var(--mu-radius-md); padding: 12px 14px; margin: 12px 0; }
  .prac-intro b { color: var(--mu-ink); font-weight: 650; }
  .exercise { border: 1px solid var(--mu-border); border-radius: var(--mu-radius-lg); padding: 14px; margin-top: 12px; background: var(--mu-white); }
  .ex-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .ex-title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .ex-hint { font-size: 12px; color: var(--mu-ink-3); text-align: right; }
  .ex-score { background: var(--mu-white); border-radius: 6px; overflow-x: auto; min-height: 90px; }
  .ex-placeholder { background: var(--mu-gray-100); border-radius: 6px; color: var(--mu-gray-400);
    font-size: 13px; display: flex; align-items: center; justify-content: center; height: 64px; }
  .ex-score svg, .osmd-host svg { max-width: none; }

  /* sheet page fills the frame; Music score flexes so score + Spotify both fit */
  #view-sheet.is-active { display: flex; flex-direction: column; height: 100%; padding-bottom: 0; }
  #view-sheet .appbar, #view-sheet .sheet-hero, #view-sheet .sheet-tabs { flex-shrink: 0; }
  #sheetPane { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 16px; }
  #sheetPane > .focus-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #sheetPane > .focus-view > .focus-scroll { flex: 1; min-height: 0; max-height: none; }
  .spotify-embed, .focus-pdf-link { flex-shrink: 0; }

  /* focus tab — floating action toolbar overlaid on the score */
  .spotify-embed { margin-top: 14px; line-height: 0; }
  .spotify-embed iframe { display: block; width: 100%; height: 80px; border-radius: 12px; }
  .focus-view { position: relative; margin-top: 14px; }
  .focus-actions { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: var(--mu-radius-full);
    background: rgba(255,255,255,0.8); border: 1px solid var(--mu-border); box-shadow: var(--mu-shadow-md);
    -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px); }
  .focus-actions button { width: 36px; height: 36px; border: none; background: transparent; border-radius: 50%;
    cursor: pointer; color: var(--mu-ink-2); display: inline-flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
  .focus-actions button:hover { background: var(--mu-gray-100); }
  .focus-actions button.is-on, .focus-actions button.is-marked { background: var(--mu-gray-900); color: #fff; }
  .focus-actions #metroToggle svg, .focus-actions #fMark svg { width: 17px; height: 17px; }
  .focus-actions #zoomVal { font-family: var(--mu-mono); font-size: 13.5px; color: var(--mu-ink-2); min-width: 42px; text-align: center; }
  .fa-sep { width: 1px; height: 20px; background: var(--mu-border); margin: 0 3px; }
  .metro-group { display: contents; }
  .focus-scroll { border: 1px solid var(--mu-border); border-radius: var(--mu-radius-lg);
    background: var(--mu-white); overflow-x: hidden; overflow-y: auto; max-height: 72vh; min-height: 320px; padding-bottom: 76px; }
  .osmd-title { text-align: center; margin: 22px 0 16px; }
  .osmd-title-name { display: block; font-size: 23px; font-weight: 650; color: var(--mu-ink); letter-spacing: -0.01em; }
  .osmd-title-name .pn-dim { color: var(--mu-ink-3); font-weight: 650; }
  .osmd-title-by { display: block; font-size: 15px; color: var(--mu-ink-3); margin-top: 4px; }
  .osmd-host { overflow-x: hidden; }
  .osmd-host svg { max-width: 100%; }
  .score-svg-page { width: 100%; display: block; background: #fff; }
  .score-svg-page + .score-svg-page { margin-top: 8px; }
  .focus-zoom { transform-origin: top left; transition: transform .12s var(--mu-ease); width: 100%; min-height: 100%; }
  .focus-zoom iframe { width: 100%; min-height: 60vh; border: 0; display: block; background: #fff; }
  /* PDF scores = pre-rendered page-strip images; fit width on every device incl. iOS */
  .pdf-imgwrap { width: 100%; }
  .pdf-img { width: 100%; display: block; background: #fff; }
  .pdf-img + .pdf-img { margin-top: 4px; }
  .focus-view:fullscreen { background: var(--mu-bg); padding: 16px; box-sizing: border-box; }
  .focus-view:fullscreen .focus-scroll { max-height: none; height: calc(100vh - 32px); }
  .focus-view:-webkit-full-screen { background: var(--mu-bg); padding: 16px; box-sizing: border-box; }
  .focus-view:-webkit-full-screen .focus-scroll { max-height: none; height: calc(100vh - 32px); }
  /* CSS-overlay fullscreen fallback (mobile / iOS) */
  .focus-view.fake-fs { position: fixed; inset: 0; z-index: 300; margin: 0; box-sizing: border-box; background: var(--mu-bg);
    padding: max(14px, env(safe-area-inset-top)) 12px calc(env(safe-area-inset-bottom) + 12px); }
  .focus-view.fake-fs .focus-scroll { max-height: none; height: 100%; }
  .focus-view.fake-fs .focus-actions { bottom: calc(env(safe-area-inset-bottom) + 26px); }
  .fs-close { display: none; }
  /* enlarge view: exit via the shrink icon in the toolbar (no separate go-back button) */
  .focus-view.fake-fs .fs-close { display: none; }
  body.fs-active #view-sheet .appbar, body.fs-active #view-sheet .sheet-hero, body.fs-active #view-sheet .sheet-tabs { display: none; }
  .focus-pdf-link { text-align: center; margin-top: 12px; }
  .focus-pdf-link a { font-size: 13px; font-weight: 550; color: var(--mu-ink-3); text-decoration: none; }
  .focus-pdf-link a:hover { color: var(--mu-ink); }
  .zoomctrl { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--mu-border); border-radius: var(--mu-radius-full); padding: 3px; }
  .zoomctrl button { width: 34px; height: 34px; border: 0; background: transparent; font-size: 20px; line-height: 1; padding: 0; cursor: pointer; border-radius: 50%; color: var(--mu-ink-2); display: inline-flex; align-items: center; justify-content: center; }
  .zoomctrl button:hover { background: var(--mu-gray-100); }
  .zoomctrl span { font-family: var(--mu-mono); font-size: 12px; min-width: 46px; text-align: center; color: var(--mu-ink-2); }
  .fbtn-link { display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: var(--mu-radius-full);
    border: 1px solid var(--mu-border); background: var(--mu-white); font-size: 13px; font-weight: 600; color: var(--mu-ink-2); text-decoration: none; }
  .fbtn-link:hover { background: var(--mu-gray-50); }

  /* honest empty state when a piece has no score file yet */
  .score-empty { border-radius: var(--mu-radius-lg); background: var(--mu-gray-100);
    padding: 40px 24px; text-align: center; color: var(--mu-ink-3);
    min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-empty-ic { color: var(--mu-gray-400); margin-bottom: 10px; }
  .score-empty-ic svg { width: 28px; height: 28px; }
  .score-empty-t { font-size: 15px; font-weight: 650; color: var(--mu-ink-2); }
  .score-empty-s { font-size: 13px; margin-top: 4px; line-height: 1.5; max-width: 340px; margin-left: auto; margin-right: auto; }

  /* score preview */
  .score {
    margin-top: 18px; border: 1px solid var(--mu-border); border-radius: var(--mu-radius-lg);
    background: var(--mu-gray-50); padding: 18px 16px; overflow: hidden;
  }
  .score svg { width: 100%; height: auto; display: block; }
  .score-note { font-size: 11.5px; color: var(--mu-gray-400); text-align: center; margin-top: 8px; }

  /* player transport */
  .player {
    margin-top: 16px; border: 1px solid var(--mu-border); border-radius: var(--mu-radius-lg);
    padding: 16px; background: var(--mu-white);
  }
  .player-row { display: flex; align-items: center; gap: 14px; }
  .play-btn {
    width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0; border: none; cursor: pointer;
    background: var(--mu-gray-900); color: #fff; display: inline-flex; align-items: center; justify-content: center;
    transition: transform .1s var(--mu-ease), background var(--mu-fast) var(--mu-ease);
  }
  .play-btn:hover { background: var(--mu-gray-800); }
  .play-btn:active { transform: scale(.96); }
  .track { flex: 1; }
  .track-bar { height: 6px; border-radius: 3px; background: var(--mu-gray-200); overflow: hidden; }
  .track-fill { height: 100%; background: var(--mu-gray-900); width: 0%; transition: width .2s linear; }
  .track-time { display: flex; justify-content: space-between; font-family: var(--mu-mono); font-size: 11.5px; color: var(--mu-ink-3); margin-top: 7px; }

  /* metronome + tools */
  .toolgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .tool {
    border: 1px solid var(--mu-border); border-radius: var(--mu-radius-md); padding: 14px; background: var(--mu-white);
  }
  .tool-label { font-size: 12px; font-weight: 600; color: var(--mu-ink-3); text-transform: uppercase; letter-spacing: .05em; }
  .metro-bpm { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .metro-bpm small { font-size: 13px; font-weight: 500; color: var(--mu-ink-3); letter-spacing: 0; }
  .metro-ctrl { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .metro-ctrl button {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--mu-border); background: var(--mu-white);
    font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--mu-ink);
  }
  .metro-ctrl button:hover { background: var(--mu-gray-50); }
  .metro-ctrl button.metro-go { flex: 1; width: auto; border-radius: var(--mu-radius-full);
    background: var(--mu-gray-900); color: #fff; border-color: var(--mu-gray-900); font-size: 13px; font-weight: 600; }
  .metro-ctrl button.metro-go.is-on { background: var(--mu-white); color: var(--mu-ink); border-color: var(--mu-border); }
  .metro-dots { display: flex; gap: 6px; margin-top: 12px; }
  .metro-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--mu-gray-200); transition: background .06s; }
  .metro-dots i.beat { background: var(--mu-gray-900); }

  /* timer / ring */
  .timer-time { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .ring-wrap { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  .ring { width: 62px; height: 62px; flex-shrink: 0; }
  .ring text { font-family: var(--mu-font); font-weight: 700; font-size: 15px; fill: var(--mu-ink); }
  .prog-range { width: 100%; margin-top: 10px; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: var(--mu-gray-200); outline: none; }
  .prog-range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--mu-gray-900); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.25); }

  /* story / warmup */
  .story-p { font-size: 15px; line-height: 1.62; color: var(--mu-ink); }
  .warmup-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .warmup-item { display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; border: 1px solid var(--mu-border);
    border-radius: var(--mu-radius-md); background: var(--mu-white); }
  .warmup-num { width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; background: var(--mu-gray-100);
    font-family: var(--mu-mono); font-size: 12px; font-weight: 600; color: var(--mu-ink-2);
    display: inline-flex; align-items: center; justify-content: center; }
  .warmup-txt { font-size: 14px; line-height: 1.45; }
  .warmup-txt b { font-weight: 650; color: var(--mu-ink); }

  .actionbtn-row { display: flex; gap: 10px; margin-top: 16px; }
  .actionbtn-row .btn { flex: 1; }
  .mark-btn.is-marked { background: var(--mu-gray-900); color: #fff; border-color: var(--mu-gray-900); }

  /* empty state */
  .empty { text-align: center; padding: 64px 20px; color: var(--mu-ink-3); }
  .empty svg { color: var(--mu-gray-300); margin-bottom: 14px; }
  .empty-title { font-size: 17px; font-weight: 600; color: var(--mu-ink-2); }
  .empty-sub { font-size: 14px; margin-top: 4px; }

  /* profile */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 6px; }
  .stat { border: 1px solid var(--mu-border); border-radius: var(--mu-radius-md); padding: 16px 14px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2em; font-variant-numeric: tabular-nums; }
  .tgl { position: relative; width: 46px; height: 26px; flex-shrink: 0; margin-left: auto; padding: 0; border: 0; border-radius: 999px; background: var(--mu-gray-300); cursor: pointer; transition: background .15s ease; }
  .tgl.is-on { background: var(--mu-gray-900); }
  .tgl-knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.2); transition: transform .15s ease; }
  .tgl.is-on .tgl-knob { transform: translateX(20px); }
  html[data-theme="dark"] .tgl.is-on { background: #6f6f7a; } /* muted on-track in dark mode (avoid harsh white) */
  .lang-trigger { width: auto; height: 40px; display: inline-flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; }
  .lang-caret { color: var(--mu-ink-3); flex-shrink: 0; transition: transform .15s ease; }
  .dropdown.is-open .lang-caret { transform: rotate(180deg); }
  .stat-lbl { font-size: 12px; color: var(--mu-ink-3); }
  .credits { font-size: 11.5px; line-height: 1.6; color: var(--mu-ink-3); margin-top: 28px; padding: 0 2px; }
  .settrow { display: flex; align-items: center; gap: 12px; padding: 15px 4px; border-bottom: 1px solid var(--mu-gray-100); }
  .settrow-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--mu-gray-100); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .settrow-txt { flex: 1; font-size: 15px; font-weight: 500; }
  .settrow-val { font-size: 14px; color: var(--mu-ink-3); }

  /* ---- bottom tab bar ---- */
  .tabbar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 60;
    height: 84px; padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px);
    background: rgba(255,255,255,.9);
    -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
    border-top: 1px solid var(--mu-border);
    display: flex; align-items: stretch;
  }
  .tabbtn {
    flex: 1; border: none; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--mu-gray-500); font-size: 11px; font-weight: 500;
    transition: color var(--mu-fast) var(--mu-ease);
  }
  .tabbtn svg { width: 24px; height: 24px; }
  .tabbtn.is-active { color: var(--mu-ink); }
  .tabbtn.is-active svg { stroke-width: 2.2; }

  /* smooth page crossfade (View Transitions API) */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; animation-timing-function: var(--mu-ease); }

  /* ---- dark mode (score sheet stays white) ---- */
  html[data-theme="dark"] {
    --mu-bg:#17171b; --mu-white:#232329; --mu-ink:#f2f2f5; --mu-ink-2:#c9c9d0; --mu-ink-3:#9a9aa2;
    --mu-gray-50:#2a2a31; --mu-gray-100:#31313a; --mu-gray-300:#44444d; --mu-gray-400:#6a6a74; --mu-gray-500:#8a8a94;
    --mu-gray-900:#ececf2; --mu-border:#3a3a44;
  }
  html[data-theme="dark"] body { background:#0e0e11; }
  html[data-theme="dark"] .appbar { background: rgba(30,30,36,.86); }
  html[data-theme="dark"] .tabbar { background: rgba(24,24,28,.92); }
  html[data-theme="dark"] .focus-actions { background: rgba(42,42,50,.85); }
  html[data-theme="dark"] .sortchips > button[data-sort].is-active { color:#17171b; }
  html[data-theme="dark"] .focus-actions button.is-on,
  html[data-theme="dark"] .focus-actions button.is-marked,
  html[data-theme="dark"] .mark-btn.is-marked { color:#17171b; }
  /* keep the notation/score white in dark mode */
  html[data-theme="dark"] .focus-scroll,
  html[data-theme="dark"] .score-svg-page,
  html[data-theme="dark"] .osmd-host,
  html[data-theme="dark"] .focus-zoom iframe { background:#fff; }

  /* ---- mobile / narrow screens ---- */
  @media (max-width: 640px) {
    .view { padding: 0 18px 110px; }
    .appbar { padding: 16px 18px 12px; margin: 0 -18px 4px; }
    .appbar-title { font-size: 24px; }
    /* home: stack the 2 columns */
    .home-grid { grid-template-columns: 1fr; gap: 18px; }
    .home-grid > .home-col:first-child .home-card { height: auto; max-height: 60vh; overflow-y: auto; }
    .home-grid > .home-col:last-child .home-card { flex: none; }
    .home-grid > .home-col:last-child .practice-card { min-height: 440px; }
    /* calendar: hug content on mobile (no inner scroll); it scrolls only in 2-col iPad layout */
    .cal-events { flex: none; min-height: 0; max-height: none; overflow: visible; }
    /* composer cards: single column, tighter row gap */
    .cgrid { grid-template-columns: 1fr; row-gap: 8px; }
    .toolgrid { grid-template-columns: 1fr; }
    /* sheet controls wrap comfortably */
    .sheet-meta { font-size: 12px; }
    .sheet-title { font-size: 23px; white-space: normal; overflow: visible; }
    /* piece list: show full name (wrap to 2nd/3rd line) instead of truncating */
    .prow-title { white-space: normal; overflow: visible; text-overflow: clip; }
    /* score title: smaller on phone */
    .osmd-title-name { font-size: 16px; }
    .osmd-title-by { font-size: 12px; }
    /* floating toolbar: hug items, centered (metronome hidden on mobile) */
    .focus-actions { max-width: calc(100vw - 24px); overflow-x: auto; }
    .focus-actions button { flex-shrink: 0; }
    /* declutter toolbar on mobile: hide zoom % and the whole metronome group */
    .focus-actions #zoomVal { display: none; }
    .metro-group { display: none; }
    /* sort: same chip row as desktop (chips wrap), no dropdown */
    .sortchips { gap: 6px; flex-wrap: wrap; }
    .sortchips .grow { display: none; }
    .sortchips .filter-count { flex: 1 0 100%; margin-top: 2px; }
    /* pianist hero: avatar above name */
    .phero { flex-direction: column; }
    /* bottom nav: shorter, icons only */
    .tabbar { height: 58px; padding: 6px 10px calc(env(safe-area-inset-bottom) + 4px); }
    .tabbtn { font-size: 0; gap: 0; }
    .tabbtn svg { width: 25px; height: 25px; }
  }

  /* Touch devices (iPad / phone): all interactive controls meet the 44×44px tap-target minimum */
  @media (pointer: coarse) {
    .focus-actions { gap: 4px; }
    .focus-actions button { width: 44px; height: 44px; }
    /* touch: pinch-zoom instead of +/- buttons */
    .focus-actions #zoomOut, .focus-actions #zoomIn, .focus-actions #zoomVal, .focus-actions .fa-sep { display: none; }
    .zoomctrl button { width: 44px; height: 44px; }
    .appbar-back { width: 44px; height: 44px; }
    .sortchips > button { height: 36px; }
    .cal-link, .home-card, .recent-item, .tabbtn { min-height: 44px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="screen" id="screen">

      <!-- HOME -->
      <section class="view is-active" id="view-home"></section>
      <!-- LIBRARY -->
      <section class="view" id="view-library"></section>

  const base = p.id;

   ================================================================ */
const REL_MINOR = { "C":"A","G":"E","D":"B","A":"F♯","E":"C♯","B":"G♯","F":"D","B♭":"G","E♭":"C","A♭":"F","D♭":"B♭","G♭":"E♭","F♯":"D♯" };
const REL_MAJOR = { "A":"C","E":"G","B":"D","F♯":"A","C♯":"E","G♯":"B","D":"F","G":"B♭","C":"E♭","F":"A♭","B♭":"D♭","E♭":"G♭" };
function warmupFor(p) {
  const tonic = p.key.replace(/ (major|minor)/i, "").trim();
  const mode = modeOf(p);
  const rel = mode === "major" ? (REL_MINOR[tonic] || "the relative minor") : (REL_MAJOR[tonic] || "the relative major");
  const relLabel = mode === "major" ? `${rel} harmonic minor` : `${rel} major`;
  return [
    `<b>${tonic} ${mode} scale</b> — 2 octaves, hands together, slow and even. This is the home key of the piece.`,
    `<b>${tonic} ${mode} arpeggio</b> — 2 octaves up and down; keep the thumb-under smooth.`,
    `<b>${relLabel} scale</b> — the closely-related key you'll touch in the middle section.`,
    `<b>${tonic} ${mode} scale</b> — 2 octaves, hands together, slow and even. This is the home key of the piece.`,
    `<b>${tonic} ${mode} arpeggio</b> — 2 octaves up and down; keep the thumb-under smooth.`,
    `<b>${relLabel} scale</b> — the closely-related key you'll touch in the middle section.`,
    `<b>Chromatic scale from ${tonic}</b> — light fingers, steady pulse, to loosen the hand before playing.`,
  ];
}

/* ================================================================
   Notation system — generate MusicXML for 練音階 (scales / arpeggios /
   chromatic) with correct key signature (升降符號), render via OSMD so
   every exercise is drawn consistently (五線譜 + 音符).
   ================================================================ */
const LETTERS = ["C","D","E","F","G","A","B"];
const SHARP_ORDER = ["F","C","G","D","A","E","B"];
const FLAT_ORDER  = ["B","E","A","D","G","C","F"];
const MAJOR_FIFTHS = { "C":0,"G":1,"D":2,"A":3,"E":4,"B":5,"F♯":6,"C♯":7,"F":-1,"B♭":-2,"E♭":-3,"A♭":-4,"D♭":-5,"G♭":-6 };
const MINOR_FIFTHS = { "A":0,"E":1,"B":2,"F♯":3,"C♯":4,"G♯":5,"D♯":6,"D":-1,"G":-2,"C":-3,"F":-4,"B♭":-5,"E♭":-6 };
// semitone value of each natural letter, for chromatic spelling
const LETTER_SEMI = { "C":0,"D":2,"E":4,"F":5,"G":7,"A":9,"B":11 };
const CHROM_SHARP = [["C",0],["C",1],["D",0],["D",1],["E",0],["F",0],["F",1],["G",0],["G",1],["A",0],["A",1],["B",0]];

function fifthsFor(tonic, mode){ return (mode==="minor"?MINOR_FIFTHS:MAJOR_FIFTHS)[tonic] ?? 0; }
function alterForLetter(letter, fifths){
  if (fifths>0 && SHARP_ORDER.slice(0,fifths).includes(letter)) return 1;
  if (fifths<0 && FLAT_ORDER.slice(0,-fifths).includes(letter)) return -1;
  return 0;
}
// build ascending+descending diatonic scale, one octave, as [{step,alter,octave}]
function scaleNotes(tonic, fifths){
  const start = LETTERS.indexOf(tonic[0]);
  const up = [];
  let oct = 4;
  for (let i=0;i<=7;i++){
    const li = (start+i)%7;
    if (i>0 && li===0) oct++;               // wrapped past B -> C, next octave
    const letter = LETTERS[li];
    up.push({ step:letter, alter:alterForLetter(letter,fifths), octave:oct });
  }
  const down = up.slice(0,7).reverse();
  return up.concat(down);
}
function arpeggioNotes(tonic, fifths){
  const s = scaleNotes(tonic, fifths);
  const idx = [0,2,4,7];                      // 1-3-5-8
  const up = idx.map(i=>s[i]);
  return up.concat(up.slice(0,3).reverse());
}
function chromaticNotes(tonic){
  const startPc = (LETTER_SEMI[tonic[0]] + (tonic.includes("♯")?1:tonic.includes("♭")?-1:0) + 12) % 12;
  const notes = []; let oct = 4;
  for (let i=0;i<=12;i++){
    const pc = (startPc+i)%12;
    if (i>0 && pc===0) oct++;
    const [step,alter] = CHROM_SHARP[pc];
    notes.push({ step, alter, octave:oct });
  }
  return notes;
}
function noteXML(n){
  return `<note><pitch><step>${n.step}</step>${n.alter?`<alter>${n.alter}</alter>`:""}<octave>${n.octave}</octave></pitch><duration>1</duration><type>eighth</type></note>`;
}
function restXML(){ return `<note><rest/><duration>1</duration><type>eighth</type></note>`; }
function exerciseXML(notes, fifths){
  // 8 eighth-notes (4/4) per measure, pad the last measure with rests
  const measures = [];
  for (let i=0;i<notes.length;i+=8){
    let body = notes.slice(i,i+8).map(noteXML).join("");
    const pad = 8 - Math.min(8, notes.length-i);
    for (let r=0;r<pad;r++) body += restXML();
    const attrs = i===0 ? `<attributes><divisions>2</divisions><key><fifths>${fifths}</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>` : "";
    measures.push(`<measure number="${measures.length+1}">${attrs}${body}</measure>`);
  }
  return `<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd"><score-partwise version="3.1"><part-list><score-part id="P1"><part-name></part-name></score-part></part-list><part id="P1">${measures.join("")}</part></score-partwise>`;
}
function exercisesFor(p){
  const tonic = p.key.replace(/ (major|minor)/i,"").trim();
  const mode = modeOf(p);
  const fifths = fifthsFor(tonic, mode);
  return [
    { label:`${tonic} ${mode} scale`, hint:"2 octaves feel — slow & even, hands together", xml:exerciseXML(scaleNotes(tonic,fifths),fifths) },
    { label:`${tonic} ${mode} arpeggio`, hint:"1-3-5-8 up & down, smooth thumb-under", xml:exerciseXML(arpeggioNotes(tonic,fifths),fifths) },
    { label:`Chromatic from ${tonic}`, hint:"light fingers, steady pulse", xml:exerciseXML(chromaticNotes(tonic),0) },
  ];
}
// render a MusicXML string into host via OSMD (consistent staff/notes)
async function renderNotation(host, xml){
  if (!window.opensheetmusicdisplay){ host.innerHTML = `<div class="score-note">Notation engine not loaded</div>`; return; }
  try {
    const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(host, {
      autoResize:true, drawTitle:false, drawSubtitle:false, drawPartNames:false,
      drawingParameters:"compacttight", drawMeasureNumbers:true, measureNumberInterval:1,
      pageFormat:"A4_P", pageBackgroundColor:"#FFFFFF"   // real page breaks → up/down flips pages
    });
    await osmd.load(xml);
    // fit the fixed A4 page to the container width so the whole page shows (nothing cropped)
    const doRender = ()=>{
      try {
        const cw = host.clientWidth; if (cw <= 0) return;
        osmd.zoom = 1; osmd.render();
        const svg = host.querySelector("svg");
        if (svg) {
          const pw = svg.getBoundingClientRect().width;
          if (pw > 4) { osmd.zoom = Math.min(1.4, (cw - 2) / pw); osmd.render(); }
        }
      } catch(e){}
    };
    doRender();
    requestAnimationFrame(doRender);            // re-render once laid out (iOS settles width late)
    if (window.ResizeObserver) {
      let lastW = 0;
      new ResizeObserver(()=>{ const w = host.clientWidth; if (w > 0 && Math.abs(w - lastW) > 2) { lastW = w; doRender(); } }).observe(host);
    }
  } catch(e){ host.innerHTML = `<div class="score-note">Couldn't render notation</div>`; }
}

/* ================================================================

   ================================================================ */
let rootTab = "home";
function show(view, root, hash) {
  const apply = () => {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("is-active"));
    const el = document.getElementById("view-" + view);
    el.classList.add("is-active");
    document.getElementById("screen").scrollTop = 0;
    document.body.classList.remove("fs-active");   // clear enlarge overlay on navigate
    const tb = document.getElementById("tabbar");
    if (tb) tb.style.display = (view === "sheet") ? "none" : "";   // focused reading view
    if (root) {
      rootTab = root;
      document.querySelectorAll(".tabbtn").forEach(b => b.classList.toggle("is-active", b.dataset.tab === root));
    }
  };
  // smooth crossfade between pages where supported; instant otherwise
  if (document.startViewTransition) document.startViewTransition(apply);
  else apply();
  if (hash !== null) setHash(hash === undefined ? view : hash);
}

/* ---- hash routing: every page has a #link ---- */
let suppressRoute = false;
function setHash(h) {
  if ("#" + h === location.hash) return;
  suppressRoute = true;
  location.hash = h;
}
function routeTo(hash) {
  const [seg, arg] = (hash || "").replace(/^#\/?/, "").split("/");
  if (seg === "composer" && COMPOSERS[arg]) openPianist(arg);
  else if (seg === "piece" && pieceById(arg)) openSheet(arg);
  else if (seg === "library") { renderLibrary(); show("library","library"); }
  else if (seg === "saved") { renderSaved(); show("saved","saved"); }
  else if (seg === "profile") { renderProfile(); show("profile","profile"); }
  else { renderHome(); show("home","home"); }
}
window.addEventListener("hashchange", () => {
  if (suppressRoute) { suppressRoute = false; return; }
  routeTo(location.hash);
});
document.getElementById("tabbar").addEventListener("click", e => {
  const b = e.target.closest(".tabbtn"); if (!b) return;
  const t = b.dataset.tab;
  if (t === "home") { renderHome(); show("home","home"); }
  else if (t === "library") { renderLibrary(); show("library","library"); }
  else if (t === "saved") { renderSaved(); show("saved","saved"); }
  else if (t === "profile") { renderProfile(); show("profile","profile"); }
});

/* score preview — decorative grand-staff SVG */
function scoreSVG() {
  const line = y => `<line x1="20" x2="612" y1="${y}" y2="${y}" stroke="#c9c9cf" stroke-width="1"/>`;
  let s = "";
  for (let i=0;i<5;i++) s += line(24 + i*11);        // treble
  for (let i=0;i<5;i++) s += line(104 + i*11);       // bass
  // note heads scattered
  const notes = [90,130,170,210,250,290,330,370,410,450,490,530,570];
  let heads = "";
  notes.forEach((x,i) => {
    const y = 24 + ((i*7)%5)*11 + (i%2?5:0);
    heads += `<ellipse cx="${x}" cy="${y}" rx="6" ry="4.5" fill="#3a3a40" transform="rotate(-18 ${x} ${y})"/><line x1="${x+5.5}" x2="${x+5.5}" y1="${y}" y2="${y-30}" stroke="#3a3a40" stroke-width="1.4"/>`;
    const y2 = 104 + ((i*4)%5)*11;
    heads += `<ellipse cx="${x}" cy="${y2}" rx="6" ry="4.5" fill="#8a8a92" transform="rotate(-18 ${x} ${y2})"/>`;
  });
  return `<svg viewBox="0 0 632 168" xmlns="http://www.w3.org/2000/svg">
    <text x="26" y="60" font-size="62" fill="#3a3a40" font-family="Georgia, serif">𝄞</text>
    <text x="26" y="128" font-size="46" fill="#8a8a92" font-family="Georgia, serif">𝄢</text>
    ${s}${heads}
    <line x1="611" x2="611" y1="24" y2="148" stroke="#c9c9cf" stroke-width="2"/>
  </svg>`;
}

/* progress ring svg */
function ringSVG(pct) {
  const r = 26, c = 2*Math.PI*r, off = c*(1 - pct/100);
  return `<svg class="ring" viewBox="0 0 62 62">
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--mu-gray-200)" stroke-width="6"/>
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--mu-gray-900)" stroke-width="6"

    <text x="31" y="36" text-anchor="middle">${pct}%</text>
  </svg>`;
}

/* --- piece naming: compose the concert-standard form from coll + title --- */
function romanize(n){const t=[["X",10],["IX",9],["V",5],["IV",4],["I",1]];let r="";for(const[s,v]of t)while(n>=v){r+=s;n-=v;}return r;}
function catFix(s){return s.replace(/\b([A-Za-z]{1,3})\.(?=\d)/g,"$1. ");} // M.68 → M. 68, K.545 → K. 545
function movNo(p){const m=(p.sub||"").match(/No\.\s*(\d+)|\/(\d+)/);return m?+(m[1]||m[2]):0;}
function isMovement(p){return !!p.coll && movNo(p)>0;}
// short form for rows already grouped under their work header, e.g. "I. Prélude"
function movementLabel(p){return isMovement(p)?`${romanize(movNo(p))}. ${p.title}`:p.title;}
// full concert form, e.g. "Le tombeau de Couperin, M. 68: I. Prélude"
function pieceFullName(p){
  if(isMovement(p)) return `${catFix(p.coll)}: ${romanize(movNo(p))}. ${p.title}`;
  if(p.coll && p.coll!==p.title) return `${catFix(p.coll)}: ${p.title}`;
  if(p.sub && /^[A-Za-z]{1,4}\.?\s*\d/.test(p.sub) && !/·|No\./.test(p.sub)) return `${p.title}, ${catFix(p.sub)}`;
  return p.title;
}
// HTML forms that grey the catalogue + movement number for easier reading
function splitColl(coll){const m=coll.match(/^(.*?),\s*([A-Za-z]{0,4}\.?\s*\d.*)$/);return m?[m[1],catFix(m[2])]:[coll,""];}
function _dim(s){return `<span class="pn-dim">${s}</span>`;}
function pieceNameHTML(p){
  if(isMovement(p)){const[w,cat]=splitColl(p.coll);return `${w}${cat?`, ${cat}`:""} • ${_dim(`${romanize(movNo(p))}. ${p.title}`)}`;}
  if(p.coll && p.coll!==p.title){const[w,cat]=splitColl(p.coll);return `${w}${cat?`, ${cat}`:""} • ${_dim(p.title)}`;}
  if(p.sub && /^[A-Za-z]{1,4}\.?\s*\d/.test(p.sub) && !/·|No\./.test(p.sub)) return `${p.title}, ${catFix(p.sub)}`;
  return p.title;
}
function movementLabelHTML(p){return isMovement(p)?`${_dim(`${romanize(movNo(p))}.`)} ${p.title}`:p.title;}
// plain work + catalogue, e.g. "Le tombeau de Couperin, M. 68" ("" if standalone with no catalogue)
function pieceWorkLine(p){
  if(p.coll){const[w,cat]=splitColl(p.coll);return `${w}${cat?`, ${cat}`:""}`;}
  if(p.sub && /^[A-Za-z]{1,4}\.?\s*\d/.test(p.sub) && !/·|No\./.test(p.sub)) return catFix(p.sub);
  return "";
}
// concert form with weight (not colour) distinction: work 400, movement 600
function pieceNameWeightHTML(p){
  if(isMovement(p)){const[w,cat]=splitColl(p.coll);return `<span class="pn-work">${w}${cat?`, ${cat}`:""}: </span><span class="pn-mov">${romanize(movNo(p))}. ${p.title}</span>`;}
  if(p.coll && p.coll!==p.title){const[w,cat]=splitColl(p.coll);return `<span class="pn-work">${w}${cat?`, ${cat}`:""}: </span><span class="pn-mov">${p.title}</span>`;}
  if(p.sub && /^[A-Za-z]{1,4}\.?\s*\d/.test(p.sub) && !/·|No\./.test(p.sub)) return `<span class="pn-mov">${p.title}</span><span class="pn-work">, ${catFix(p.sub)}</span>`;
  return `<span class="pn-mov">${p.title}</span>`;
}
// row form: movement number + short title first, full work name greyed after it
function pieceRowNameHTML(p){
  const w=pieceWorkLine(p);
  if(isMovement(p)) return `${movementLabelHTML(p)}${w?_dim(` • ${w}`):""}`;
  return w && w!==p.title ? `${p.title}${_dim(` • ${w}`)}` : p.title;
}

function renderSearchResults(q) {
  const ql = q.toLowerCase();
  const pcs = PIECES.filter(p =>
    p.title.toLowerCase().includes(ql) || p.sub.toLowerCase().includes(ql) ||
    p.key.toLowerCase().includes(ql) || COMPOSERS[p.c].name.toLowerCase().includes(ql));
  const comps = Object.keys(COMPOSERS).filter(id => COMPOSERS[id].name.toLowerCase().includes(ql));
  if (!pcs.length && !comps.length)
    return `<div class="empty"><div class="empty-title">No matches for "${q}"</div>
      <div class="empty-sub">Try a composer, a key like "minor", or a piece name.</div></div>`;
  let html = "";
  if (comps.length) html += `<div class="sec"><div class="grouphead">${t("Composers")}</div><div class="cgrid" style="margin-top:10px">${comps.map(composerCard).join("")}</div></div>`;
  if (pcs.length) html += `<div class="sec"><div class="grouphead">${t("Pieces")} · ${pcs.length}</div><div class="rowlist">${pcs.map((p,i)=>pieceRow(p,i)).join("")}</div></div>`;
  return html;
}

function todayCalendar() {
  const now = new Date();
  const md = `${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const dateLabel = now.toLocaleString("en-US",{month:"short",day:"numeric"});
  const events = CALENDAR.filter(c => c.md === md);
  return { dateLabel, events: events.length ? events : [{ composer:null, year:"", title:"A quiet day", text:"No milestone today — a clear page for your own practice." }] };
}

// shared: sort a piece list into labelled groups by sort key
function groupPieces(list, sort) {
  if (sort === "key") {
    list.sort((a,b)=>a.key.localeCompare(b.key));
    const maj = list.filter(p=>modeOf(p)==="major"), min = list.filter(p=>modeOf(p)==="minor");
    return [["Major keys", maj],["Minor keys", min]].filter(([,a])=>a.length);
  }
  if (sort === "coll") {
    const colls = {};
    list.forEach(p => { const k = p.coll || "Standalone pieces"; (colls[k] = colls[k] || []).push(p); });
    return Object.entries(colls).sort((a,b)=>{
      if (a[0]==="Standalone pieces") return 1; if (b[0]==="Standalone pieces") return -1;
      return b[1].length - a[1].length;
    });
  }
  if (sort === "composer") {
    const by = {};
    list.forEach(p => { (by[p.c] = by[p.c] || []).push(p); });
    Object.values(by).forEach(arr => arr.sort((a,b)=>pieceFullName(a).localeCompare(pieceFullName(b))));
    return Object.keys(by).sort((a,b)=>cName(a).localeCompare(cName(b))).map(cid=>[cName(cid), by[cid]]);
  }
  if (sort === "year") list.sort((a,b)=>a.year-b.year);
  else if (sort === "length") list.sort((a,b)=>a.dur-b.dur);
  else if (sort === "level") list.sort((a,b)=>a.level-b.level);
  else list.sort((a,b)=>pieceFullName(a).localeCompare(pieceFullName(b))); // name (default)
  return [["", list]];
}
// shared: render labelled groups into a wrap, honouring sort field + direction
function renderGroups(wrap, groups, sort, dir) {
  wrap.innerHTML = groups.map(([label, arr]) => {
    const rows = dir === "desc" ? arr.slice().reverse() : arr;
    return `${label ? `<div class="grouphead">${label} · ${arr.length}</div>` : ""}<div class="rowlist">${rows.map((p,i)=>pieceRowWithSort(p,i,sort)).join("")}</div>`;
  }).join("");
  wirePieceRows(wrap);
}
// shared: the Sort button + field chips + search bar markup
function sortBarHTML(state, searchId, labels) {
  labels = labels || SORT_LABELS;
  return `<button class="sort-lead" data-role="dir" data-dir="${state.dir}" title="Ascending / descending" aria-label="Sort direction"><svg width="22" height="18" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path class="sd-up" d="M5 12V2M2.5 4.5L5 2l2.5 2.5"/><path class="sd-dn" d="M13 4v10M10.5 11.5L13 14l2.5-2.5"/></svg><span class="sort-lead-txt">${state.dir==="desc"?t("Desc"):t("Asc")}</span></button>
      <span class="sort-divider"></span>
      <span class="sort-by-label">${t("Sort by")}</span>
      ${Object.entries(labels).map(([k,l])=>`<button data-sort="${k}" class="${k===state.sort?'is-active':''}">${t(l)}</button>`).join("")}`;
}
// shared: wire a sort bar's dir button + chips to a state object + rerender callback
function wireSortBar(container, state, rerender) {
  container.addEventListener("click", e=>{
    const dirBtn = e.target.closest('[data-role="dir"]');
    if (dirBtn) {
      state.dir = state.dir==="asc" ? "desc" : "asc";
      dirBtn.dataset.dir = state.dir;
      const txt = dirBtn.querySelector(".sort-lead-txt"); if (txt) txt.textContent = state.dir==="desc" ? t("Desc") : t("Asc");
      rerender(); return;
    }
    const b = e.target.closest("button[data-sort]"); if (!b) return;
    state.sort = b.dataset.sort;
    container.querySelectorAll("button[data-sort]").forEach(x=>x.classList.toggle("is-active", x===b));
    rerender();
  });
}
function renderPieceList() {
  const { id, sort, tonality, q, dir } = pianistState;
  let list = piecesOf(id);
  if (tonality !== "all") list = list.filter(p => modeOf(p) === tonality);
  if (q) { const ql = q.toLowerCase();
    list = list.filter(p => p.title.toLowerCase().includes(ql) || (p.sub||"").toLowerCase().includes(ql)
      || p.key.toLowerCase().includes(ql) || (p.coll||"").toLowerCase().includes(ql)); }
  const wrap = document.getElementById("pieceListWrap");
  if (!list.length) { wrap.innerHTML = `<div class="empty"><div class="empty-title">Nothing in this filter</div></div>`; return; }
  renderGroups(wrap, groupPieces(list, sort), sort, dir);
}
function pieceRowWithSort(p, idx, sort) {
  const pct = pctOf(p.id);
  // right-side tag reflects the current sort dimension
  let tag;
  if (sort === "year") tag = p.year;
  else if (sort === "length") tag = fmtDur(p.dur);
  else if (sort === "key") tag = p.key;
  else tag = "Lv " + p.level;   // name, level, coll
  return `<div class="prow" data-piece="${p.id}">
    <div class="prow-body">
      <div class="prow-title">${sort==='coll'?(isMovement(p)?`${romanize(movNo(p))}. ${p.title}`:p.title):pieceNameHTML(p)}</div>
      <div class="prow-meta"><span>Lv ${p.level}</span><span class="dot-sep">${p.year}</span><span class="dot-sep">${fmtDur(p.dur)}</span><span class="dot-sep">${p.key}</span></div>
    </div>
    <div class="prow-right">
      ${(sort==='coll'||sort==='name'||sort==='composer')?"":`<span class="lvpill">${tag}</span>`}
      ${pct>0?`<span class="prow-pct">${pct}%</span>`:""}
    </div>
  </div>`;
}

        const cur = Math.round(scroll.scrollTop / ph);
        scroll.scrollTo({top: Math.max(0, (cur + dir) * ph), behavior:"smooth"});
      };
      pane.querySelector("#pgNext").addEventListener("click", ()=> snapPage(1));

/* ---- metronome via Web Audio ---- */
let audioCtx = null, metroInterval = null, metroBeat = 0;
function startMetro(dots) {
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state==="suspended") audioCtx.resume();
  metroBeat = 0;
  const tick = () => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const accent = metroBeat % 4 === 0;
    o.frequency.value = accent ? 1500 : 1000;
    g.gain.setValueAtTime(accent?0.5:0.28, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.05);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.06);
    dots.forEach((d,i)=>d.classList.toggle("beat", i===metroBeat%4));
    metroBeat++;
  };
  tick();
  metroInterval = setInterval(tick, 60000/sheetCtx.bpm);
}
function stopMetro(dots){ clearInterval(metroInterval); metroInterval=null; if(dots) dots.forEach(d=>d.classList.remove("beat")); }
function restartMetro(){ const dots=document.querySelectorAll("#metroDots i"); stopMetro(dots); startMetro(dots); }
function stopAllPractice() {
  if (!sheetCtx) return;
  clearInterval(sheetCtx.playTimer); clearInterval(sheetCtx.timer);
  stopMetro(document.querySelectorAll("#metroDots i"));
  stopPlayback();
  if (sheetCtx.timerOn) save();
  sheetCtx.playing=sheetCtx.timerOn=sheetCtx.metroOn=false;
}

/* ---- real playback: sampled grand piano (Salamander) driven by MusicXML notes ---- */
let playback = null;
let playStarting = false, playCancel = false;
let sampler = null; // { ctx, buffers:{midi:AudioBuffer}, midis:[], ready:Promise }
// pre-decode piano samples on the first user gesture so the first Play is instant (no decode delay)
window.addEventListener("pointerdown", function warm(){ try{ getSampler(); }catch(e){} window.removeEventListener("pointerdown", warm); }, { once:true });
function isPlayable(id){ return !!(window.SCORE_NOTES && window.SCORE_NOTES[id]); }
function getSampler(){
  if (sampler) return sampler;
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const buffers = {};
  const entries = Object.entries(window.PIANO_SAMPLES || {});
  const ready = Promise.all(entries.map(([midi,uri])=>{
    const bin = atob(uri.split(",").pop());
    const arr = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return ctx.decodeAudioData(arr.buffer).then(buf=>{ buffers[+midi]=buf; });
  }));
  sampler = { ctx, buffers, midis: entries.map(e=>+e[0]).sort((a,b)=>a-b), ready };
  return sampler;
}
function stopPlayback(){
  if (playStarting) playCancel = true;   // abort an in-flight start too
  if (!playback) return;
  clearInterval(playback.tick);
  playback.nodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
  playback = null;
  const hp = document.querySelector("#hdrPlay"); if (hp) hp.innerHTML = IC.play;
  const fill = document.querySelector("#trackFill"); if (fill) fill.style.width = "0%";
  const tc = document.querySelector("#tCur"); if (tc) tc.textContent = "0:00";
}
async function playPiece(id, onProgress, onEnd){
  stopPlayback();
  const data = window.SCORE_NOTES && window.SCORE_NOTES[id];
  if (!data || !data.notes.length) return false;
  const S = getSampler();
  await S.ready;
  if (playCancel) { playCancel = false; return false; }   // user tapped stop during startup
  const ctx = S.ctx;
  if (ctx.state === "suspended") await ctx.resume();
  if (playCancel) { playCancel = false; return false; }
  const spb = 60/(sheetCtx.bpm || data.bpm || 72);   // seconds per quarter, follows the tempo tag
  const t0 = ctx.currentTime + 0.25;
  const master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
  const nodes = []; let musicEnd = 0;
  data.notes.forEach(([midi,off,dur])=>{
    // nearest recorded sample, pitch-shifted to the target note
    let best = S.midis[0];
    for (const m of S.midis) if (Math.abs(m-midi) < Math.abs(best-midi)) best = m;
    const buf = S.buffers[best]; if (!buf) return;
    const start = t0 + off*spb, held = Math.max(0.15, dur*spb);
    const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = Math.pow(2,(midi-best)/12);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.85, start);
    const relEnd = start + held + 0.35;                 // let the note ring, then release
    g.gain.setValueAtTime(0.85, start + held);
    g.gain.exponentialRampToValueAtTime(0.0001, relEnd);
    src.connect(g); g.connect(master); src.start(start); src.stop(relEnd + 0.05);
    nodes.push(src); musicEnd = Math.max(musicEnd, off+dur);
  });
  playback = { ctx, nodes };
  const total = musicEnd*spb;
  playback.tick = setInterval(()=>{
    const el = ctx.currentTime - t0;
    onProgress && onProgress(Math.max(0,Math.min(1, el/total)), Math.max(0, el));
    if (el >= total) { onEnd && onEnd(); stopPlayback(); }
  }, 100);
  return true;
}
function togglePlay(id){
  if (playback) { stopPlayback(); return; }
  if (playStarting) { playCancel = true; return; }   // still decoding/scheduling → cancel this start
  playStarting = true; playCancel = false;
  const hp = document.querySelector("#hdrPlay"); if (hp) hp.innerHTML = IC.pause;
  const fill = document.querySelector("#trackFill"), tCur = document.querySelector("#tCur");
  playPiece(id,
    (frac,el)=>{ if(fill) fill.style.width=(frac*100)+"%"; if(tCur) tCur.textContent=fmtClock(Math.floor(el)); },
    ()=>{}).then(ok=>{ playStarting = false; if(!ok && hp) hp.innerHTML = IC.play; });
}

/* ================================================================
   SAVED
   ================================================================ */
let savedState = { sort:"name", q:"", dir:"asc" };
function renderSaved() {
  const v = document.getElementById("view-saved");
  const total = S.saved.length;
  v.innerHTML = `
    <div class="appbar" style="flex-direction:column;align-items:stretch;gap:2px">
      <div class="appbar-title">${t("Playlist")}</div>
      <div class="appbar-sub">${S.lang==='en' ? `${total} marked ${total===1?"piece":"pieces"}` : `已收藏 ${total} 首`}</div>
    </div>
    ${total ? `
      <div class="sortchips" id="savedSort">${sortBarHTML(savedState, "savedSearch", SORT_LABELS_SAVED)}</div>
      <div id="savedListWrap"></div>` :
      `<div class="empty">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
        <div class="empty-title">${t("No saved pieces yet")}</div>
        <div class="empty-sub">${t("Tap the bookmark on any piece to keep it here.")}</div>
      </div>`}`;
  if (total) {
    savedState.q = "";
    const savedSearchEl = v.querySelector("#savedSearch");
    if (savedSearchEl) savedSearchEl.addEventListener("input", e=>{ savedState.q = e.target.value.trim(); renderSavedList(); });
    wireSortBar(v.querySelector("#savedSort"), savedState, renderSavedList);
    renderSavedList();
  }
}
function renderSavedList() {
  const wrap = document.getElementById("savedListWrap"); if (!wrap) return;
  let list = S.saved.map(pieceById).filter(Boolean);
  const q = savedState.q;
  if (q) { const ql = q.toLowerCase();
    list = list.filter(p => p.title.toLowerCase().includes(ql) || (p.sub||"").toLowerCase().includes(ql)
      || p.key.toLowerCase().includes(ql) || (p.coll||"").toLowerCase().includes(ql)
      || COMPOSERS[p.c].name.toLowerCase().includes(ql)); }
  if (!list.length) { wrap.innerHTML = `<div class="empty"><div class="empty-title">${t("No saved pieces yet")}</div></div>`; return; }
  renderGroups(wrap, groupPieces(list, savedState.sort), savedState.sort, savedState.dir);
}

/* ================================================================
   PROFILE
   ================================================================ */
function renderProfile() {
  const v = document.getElementById("view-profile");
  const totalSec = Object.values(S.practiceSec).reduce((a,b)=>a+b,0);
  const touched = Object.keys(S.progress).filter(k=>S.progress[k]>0).length || Object.keys(S.practiceSec).length;
  const learned = Object.values(S.progress).filter(p=>p>=100).length;
  const inProgress = PIECES.filter(p=>pctOf(p.id)>0 && pctOf(p.id)<100).sort((a,b)=>pctOf(b.id)-pctOf(a.id));
  v.innerHTML = `
    <div class="appbar" style="flex-direction:column;align-items:stretch;gap:2px">
      <div class="appbar-title">${t("Profile")}</div>
      <div class="appbar-sub">${t("Advanced pianist")}</div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;margin:6px 0 20px">
      <div class="cav" style="width:64px;height:64px;margin:0"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></div>
      <div>
        <div style="font-size:20px;font-weight:700;letter-spacing:-0.02em">Pianist</div>
        <div style="font-size:13px;color:var(--mu-ink-3)">Keep the streak alive 🎹</div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-num">8 ${t("days")}</div><div class="stat-lbl">${t("Practiced in 2026")}</div></div>
      <div class="stat"><div class="stat-num">8</div><div class="stat-lbl">${t("Pieces")}</div></div>
      <div class="stat"><div class="stat-num">5</div><div class="stat-lbl">${t("Composers")}</div></div>
    </div>

    ${inProgress.length ? `<div class="sec">
      <div class="sec-head"><div class="sec-title">${t("In progress")}</div></div>
      <div class="rowlist">${inProgress.map((p,i)=>pieceRow(p,i)).join("")}</div>
    </div>` : ""}

    <div class="sec">
      <div class="sec-head"><div class="sec-title">${t("Settings")}</div></div>
      <div class="settrow"><div class="settrow-ic">${IC.moon}</div><div class="settrow-txt">${t("Dark mode")}</div>
        <button class="tgl${S.theme==='dark'?' is-on':''}" id="themeSwitch" role="switch" aria-checked="${S.theme==='dark'}"><span class="tgl-knob"></span></button>
      </div>
      <div class="settrow">
        <div class="settrow-ic">${IC.globe}</div><div class="settrow-txt">${t("Language")}</div>
        <div class="dropdown" id="langDD" style="margin-left:auto">
          <button type="button" class="input lang-trigger" id="langTrigger" aria-haspopup="menu" aria-expanded="false">
            <span>${LANGS[S.lang]}</span>
            <svg class="lang-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="menu menu-right" role="menu" id="langMenu">
            ${Object.entries(LANGS).map(([k,name])=>`<button type="button" class="menu-item${k===S.lang?' is-selected':''}" role="menuitem" data-lang="${k}">${name}</button>`).join("")}
          </div>
        </div>
      </div>
    </div>`;
  wirePieceRows(v);
  v.querySelector("#themeSwitch").addEventListener("click", e=>{
    S.theme = S.theme==='dark' ? 'light' : 'dark'; save(); applyTheme();
    const sw = e.currentTarget;
    sw.classList.toggle('is-on', S.theme==='dark');
    sw.setAttribute('aria-checked', S.theme==='dark');
  });
  const langDD = v.querySelector("#langDD");
  const langTrigger = v.querySelector("#langTrigger");
  langTrigger.addEventListener("click", e=>{
    e.stopPropagation();
    const open = langDD.classList.toggle("is-open");
    langTrigger.setAttribute("aria-expanded", open);
  });
  document.addEventListener("click", e=>{ if(!langDD.contains(e.target)) langDD.classList.remove("is-open"); });
  v.querySelectorAll("#langMenu .menu-item").forEach(mi=>{
    mi.addEventListener("click", ()=>{
      S.lang = mi.dataset.lang; save();
      document.documentElement.lang = S.lang;
      applyTabLabels();
      renderProfile();
    });
  });
}

/* ================================================================
   Boot — route from the URL hash so every page is deep-linkable
   ================================================================ */
applyTheme();
document.documentElement.lang = S.lang;
applyTabLabels();
routeTo(location.hash);
</script>
</body>
